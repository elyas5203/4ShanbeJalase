<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل ادمین - کارآگاه سایبری</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: #fff;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }
        
        /* Sidebar */
        .sidebar {
            width: 280px;
            background: #2d2d2d;
            border-left: 2px solid #444;
            display: flex;
            flex-direction: column;
        }
        
        .sidebar-header {
            padding: 20px;
            background: #333;
            text-align: center;
            border-bottom: 2px solid #444;
        }
        
        .sidebar-title {
            font-size: 18px;
            font-weight: bold;
            color: #00ff88;
        }
        
        .users-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        
        .user-card {
            background: #3a3a3a;
            margin: 8px 0;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }
        
        .user-card:hover {
            background: #4a4a4a;
            border-color: #00ff88;
            transform: translateX(-3px);
        }
        
        .user-card.active {
            background: #00ff88;
            color: #000;
            border-color: #fff;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }
        
        .user-name {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
        }
        
        .user-id {
            font-size: 12px;
            opacity: 0.8;
        }
        
        /* Main Area */
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1e1e1e;
        }
        
        .top-bar {
            background: #333;
            padding: 15px 20px;
            border-bottom: 2px solid #444;
            display: none;
        }
        
        .selected-user {
            font-size: 18px;
            font-weight: bold;
            color: #00ff88;
        }
        
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow: hidden;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            background: #2a2a2a;
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .no-selection {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            font-size: 20px;
            color: #666;
            text-align: center;
        }
        
        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
            position: relative;
        }
        
        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            border-bottom-right-radius: 4px;
        }
        
        .message.admin {
            align-self: flex-start;
            background: linear-gradient(135deg, #28a745, #1e7e34);
            color: white;
            border-bottom-left-radius: 4px;
        }
        
        .message-text {
            margin-bottom: 5px;
            line-height: 1.4;
        }
        
        .message-time {
            font-size: 11px;
            opacity: 0.8;
            text-align: right;
        }
        
        .input-section {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            display: none;
        }
        
        .message-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #444;
            border-radius: 25px;
            background: #3a3a3a;
            color: #fff;
            font-size: 14px;
            resize: none;
            outline: none;
            min-height: 45px;
            max-height: 100px;
        }
        
        .message-input:focus {
            border-color: #00ff88;
        }
        
        .send-button {
            padding: 12px 20px;
            background: #00ff88;
            color: #000;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .send-button:hover {
            background: #00cc6a;
            transform: scale(1.05);
        }
        
        .controls-bar {
            background: #333;
            padding: 12px 20px;
            border-top: 2px solid #444;
            display: none;
        }
        
        .control-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .control-btn {
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .btn-blue { background: #007bff; color: white; }
        .btn-orange { background: #fd7e14; color: white; }
        .btn-red { background: #dc3545; color: white; }
        
        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        
        /* Test Button */
        .test-btn {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 1000;
            background: #ff4444;
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(255, 68, 68, 0.4);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 4px 12px rgba(255, 68, 68, 0.4); }
            50% { box-shadow: 0 4px 20px rgba(255, 68, 68, 0.8); }
            100% { box-shadow: 0 4px 12px rgba(255, 68, 68, 0.4); }
        }
        
        .test-btn:hover {
            background: #ff2222;
            transform: scale(1.1);
        }
        
        /* Success Animation */
        @keyframes success {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); background: #00ff88; }
            100% { transform: scale(1); }
        }
        
        .success-animation {
            animation: success 0.5s ease;
        }
    </style>
</head>
<body>
    <!-- Test Button -->
    <button class="test-btn" onclick="runTest()">🧪 تست سیستم</button>
    
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">🎮 پنل مدیریت</div>
            <div style="font-size: 12px; margin-top: 5px; opacity: 0.8;">کارآگاه سایبری</div>
        </div>
        
        <div class="users-container">
            <div class="user-card" onclick="selectUser(this, 'user1', 'علی احمدی')">
                <div class="user-name">علی احمدی</div>
                <div class="user-id">شناسه: #001</div>
            </div>
            
            <div class="user-card" onclick="selectUser(this, 'user2', 'سارا محمدی')">
                <div class="user-name">سارا محمدی</div>
                <div class="user-id">شناسه: #002</div>
            </div>
            
            <div class="user-card" onclick="selectUser(this, 'user3', 'محمد رضایی')">
                <div class="user-name">محمد رضایی</div>
                <div class="user-id">شناسه: #003</div>
            </div>
            
            <div class="user-card" onclick="selectUser(this, 'user4', 'فاطمه نوری')">
                <div class="user-name">فاطمه نوری</div>
                <div class="user-id">شناسه: #004</div>
            </div>
        </div>
    </div>
    
    <!-- Main Area -->
    <div class="main-area">
        <!-- Top Bar -->
        <div class="top-bar" id="topBar">
            <div class="selected-user" id="selectedUserName">کاربری انتخاب نشده</div>
        </div>
        
        <!-- Chat Container -->
        <div class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div class="no-selection">
                    🎯 یک کاربر را از لیست سمت راست انتخاب کنید<br>
                    <small style="margin-top: 10px; opacity: 0.7;">پس از انتخاب کاربر، می‌توانید با او چت کنید</small>
                </div>
            </div>
            
            <div class="input-section" id="inputSection">
                <textarea id="messageInput" class="message-input" placeholder="پیام خود را اینجا بنویسید..." rows="1"></textarea>
                <button class="send-button" onclick="sendMessage()">📤 ارسال</button>
            </div>
        </div>
        
        <!-- Controls Bar -->
        <div class="controls-bar" id="controlsBar">
            <div class="control-buttons">
                <button class="control-btn btn-blue" onclick="advanceStage()">⚡ مرحله بعد</button>
                <button class="control-btn btn-red" onclick="resetProgress()">🔄 بازنشانی</button>
                <button class="control-btn btn-orange" onclick="triggerHack()">💀 فاز هک</button>
                <button class="control-btn btn-red" onclick="triggerSenior()">👨‍💼 فاز ارشد</button>
            </div>
        </div>
    </div>

    <script>
        // Global Variables
        let currentUser = null;
        let messageCount = 0;
        
        // Test Function
        function runTest() {
            const steps = [
                "✅ سیستم بارگذاری شده",
                "✅ رابط کاربری آماده",
                "✅ دکمه‌ها فعال",
                "✅ چت سیستم آماده",
                "🎯 حالا یک کاربر را انتخاب کنید!"
            ];
            
            let message = "🧪 تست سیستم:\n\n";
            steps.forEach(step => {
                message += step + "\n";
            });
            
            alert(message);
            console.log("🧪 System test completed successfully!");
        }
        
        // Select User Function
        function selectUser(element, userId, userName) {
            console.log(`👤 Selecting user: ${userName} (${userId})`);
            
            // Remove previous selection
            document.querySelectorAll('.user-card').forEach(card => {
                card.classList.remove('active');
            });
            
            // Add selection to current user
            element.classList.add('active');
            element.classList.add('success-animation');
            
            // Store current user
            currentUser = { id: userId, name: userName };
            
            // Show top bar
            const topBar = document.getElementById('topBar');
            const selectedUserName = document.getElementById('selectedUserName');
            topBar.style.display = 'block';
            selectedUserName.textContent = `💬 در حال چت با: ${userName}`;
            
            // Show input section
            const inputSection = document.getElementById('inputSection');
            inputSection.style.display = 'flex';
            
            // Show controls
            const controlsBar = document.getElementById('controlsBar');
            controlsBar.style.display = 'block';
            
            // Load sample conversation
            loadSampleChat(userName);
            
            // Show success message
            setTimeout(() => {
                element.classList.remove('success-animation');
                alert(`✅ کاربر "${userName}" انتخاب شد!\n\n🎯 حالا می‌توانید:\n• پیام ارسال کنید\n• از دکمه‌های کنترل استفاده کنید`);
            }, 500);
        }
        
        // Load Sample Chat
        function loadSampleChat(userName) {
            const chatMessages = document.getElementById('chatMessages');
            
            const sampleMessages = [
                {
                    type: 'admin',
                    text: `سلام ${userName}! به بازی کارآگاه سایبری خوش آمدید.`,
                    time: '13:25'
                },
                {
                    type: 'user',
                    text: 'سلام! ممنون از راهنمایی‌تون.',
                    time: '13:26'
                },
                {
                    type: 'admin',
                    text: 'آماده شروع ماموریت هستید؟',
                    time: '13:27'
                },
                {
                    type: 'user',
                    text: 'بله، کاملاً آماده‌ام!',
                    time: '13:28'
                }
            ];
            
            chatMessages.innerHTML = '';
            
            sampleMessages.forEach(msg => {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${msg.type}`;
                messageDiv.innerHTML = `
                    <div class="message-text">${msg.text}</div>
                    <div class="message-time">${msg.time}</div>
                `;
                chatMessages.appendChild(messageDiv);
            });
            
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        // Send Message Function
        function sendMessage() {
            const messageInput = document.getElementById('messageInput');
            const chatMessages = document.getElementById('chatMessages');
            
            const messageText = messageInput.value.trim();
            
            if (!messageText) {
                alert('⚠️ لطفاً پیامی بنویسید!');
                return;
            }
            
            if (!currentUser) {
                alert('⚠️ لطفاً ابتدا یک کاربر را انتخاب کنید!');
                return;
            }
            
            console.log(`📤 Sending message to ${currentUser.name}: ${messageText}`);
            
            // Create message element
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message admin';
            messageDiv.innerHTML = `
                <div class="message-text">${messageText}</div>
                <div class="message-time">${new Date().toLocaleTimeString('fa-IR')}</div>
            `;
            
            // Add to chat
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            
            // Clear input
            messageInput.value = '';
            messageInput.style.height = 'auto';
            
            // Show success
            messageDiv.classList.add('success-animation');
            
            // Simulate user response after 2 seconds
            setTimeout(() => {
                simulateUserResponse();
            }, 2000);
            
            messageCount++;
            console.log(`✅ Message sent successfully! Total messages: ${messageCount}`);
        }
        
        // Simulate User Response
        function simulateUserResponse() {
            const responses = [
                'متوجه شدم، ممنون!',
                'باشه، انجام میدم.',
                'سوال دیگه‌ای دارم...',
                'این قسمت رو نفهمیدم.',
                'عالی! ادامه بدید.',
                'کی مرحله بعد شروع میشه؟'
            ];
            
            const randomResponse = responses[Math.floor(Math.random() * responses.length)];
            const chatMessages = document.getElementById('chatMessages');
            
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message user';
            messageDiv.innerHTML = `
                <div class="message-text">${randomResponse}</div>
                <div class="message-time">${new Date().toLocaleTimeString('fa-IR')}</div>
            `;
            
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        // Control Functions
        function advanceStage() {
            if (!currentUser) {
                alert('⚠️ لطفاً ابتدا یک کاربر را انتخاب کنید!');
                return;
            }
            
            alert(`⚡ مرحله بعد برای "${currentUser.name}" فعال شد!\n\n🎯 کاربر به مرحله جدید منتقل خواهد شد.`);
            console.log(`⚡ Advanced stage for user: ${currentUser.name}`);
        }
        
        function resetProgress() {
            if (!currentUser) {
                alert('⚠️ لطفاً ابتدا یک کاربر را انتخاب کنید!');
                return;
            }
            
            if (confirm(`🔄 آیا مطمئن هستید که می‌خواهید پیشرفت "${currentUser.name}" را بازنشانی کنید؟\n\nاین عمل غیرقابل بازگشت است!`)) {
                alert(`🔄 پیشرفت "${currentUser.name}" با موفقیت بازنشانی شد!`);
                console.log(`🔄 Reset progress for user: ${currentUser.name}`);
            }
        }
        
        function triggerHack() {
            if (!currentUser) {
                alert('⚠️ لطفاً ابتدا یک کاربر را انتخاب کنید!');
                return;
            }
            
            alert(`💀 فاز هک برای "${currentUser.name}" فعال شد!\n\n🎯 کاربر وارد حالت هکر خواهد شد.`);
            console.log(`💀 Triggered hack phase for user: ${currentUser.name}`);
        }
        
        function triggerSenior() {
            if (!currentUser) {
                alert('⚠️ لطفاً ابتدا یک کاربر را انتخاب کنید!');
                return;
            }
            
            alert(`👨‍💼 فاز کارآگاه ارشد برای "${currentUser.name}" فعال شد!\n\n🎯 کاربر به کارآگاه ارشد ارتقا خواهد یافت.`);
            console.log(`👨‍💼 Triggered senior phase for user: ${currentUser.name}`);
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🎮 Admin Panel Loaded Successfully!');
            
            // Auto-resize textarea
            const messageInput = document.getElementById('messageInput');
            messageInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 100) + 'px';
            });
            
            // Enter key to send
            messageInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            
            // Welcome message
            setTimeout(() => {
                alert('🎮 پنل مدیریت کارآگاه سایبری\n\n✅ سیستم آماده است!\n\n🎯 مراحل:\n1. روی دکمه قرمز کلیک کنید\n2. یک کاربر را انتخاب کنید\n3. شروع به چت کنید');
            }, 1000);
        });
    </script>
</body>
</html>
