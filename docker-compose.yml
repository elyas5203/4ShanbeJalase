version: '3.8'

services:
  saas_app:
    build: .
    container_name: saas_subscription_manager
    restart: always
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    environment:
      - DATABASE_URL=sqlite:////app/data/saas.db
      - PORT=8000
    env_file:
      - .env
